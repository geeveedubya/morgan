# Review cadence and approval flow.
# Scheduling is owned by Gregg. The daily routine below was set up at his
# request on 2026-07-07 (plan approved in chat). Morgan never creates or
# changes schedules unprompted; Gregg can pause/change it any time by asking.

scheduling:
  daily_run:
    trigger_id: trig_01PmYT8Ki3DzC7HqJMen6orA
    cadence: "26 6 * * *"      # 06:26 UTC daily = 7:26am UK in summer, 6:26am in winter
    fires: fresh cloud session running the transaction watcher
    notifications: [push, email]   # from the Claude platform when the run completes
    created: 2026-07-07
    caveat: >
      Whether a headless session can reach Stripe/Airtable is unproven until
      the first firing — the run reports honestly if a source is unreachable
      (see docs/connector-status.md).
  weekly_summary_run: not yet scheduled (roadmap phase 4 remainder)

daily_digest:
  what: >
    All transactions currently pending review, each with its proposed category
    and one-sentence reasoning, plus anything flagged by always_queue rules.
  written_to: briefings/daily/YYYY-MM-DD.md
  tone: plain English — explicit amounts, dates, merchant names; numbered so
    Gregg can reply "approve 1, 3; decline 2" in chat

weekly_summary:
  what: >
    Totals by category (booked and pending), approved vs declined counts,
    anomalies (duplicates, unusual amounts, unmatched Stripe payouts), and
    anything ageing in the pending queue.
  written_to: briefings/weekly/YYYY-Www.md

approval_flow:
  # The only path into the books. Nothing skips pending.
  states:
    pending:   proposed by an agent, waiting for Gregg
    approved:  Gregg approved in chat — ready to book
    declined:  Gregg declined in chat — kept in queue history, never deleted
    booked:    approved entry written to books/<tax-year>/<YYYY-MM>.yaml
  mechanism: chat
  example: 'approve 1 and 3, decline 2 — that one is personal'
  rules:
    - nothing is booked as business without an explicit approval from Gregg
    - declined entries are retained with status declined (audit trail)
    - non-GBP entries stay pending until Gregg says how to record them
