# Review cadence and approval flow.
# Scheduling is owned by Gregg. The daily routine below was set up at his
# request on 2026-07-07 (plan approved in chat). Morgan never creates or
# changes schedules unprompted; Gregg can pause/change it any time by asking.

scheduling:
  # Model (rewired 2026-07-09 after the reminder-only setup left Gregg with a
  # nudge but no digest): the SCAN runs itself each morning by resuming
  # Morgan's own long-lived session — the one environment proven to have the
  # repo, the connectors, and Morgan's context. A separate notification
  # trigger then tells Gregg the digest is ready.
  daily_scan:
    trigger_id: trig_018eHkM9Sx6MMa6V69tUWr85   # recreated 2026-07-09 to add the dashboard refresh step
    status: active (created 2026-07-09; first firing 2026-07-10 is the proof)
    cadence: "56 5 * * *"      # 05:56 UTC = 6:56am UK summer / 5:56am winter
    does: >
      Resumes Morgan's session (session_01KK55NqifUquguTwBiQy77X), runs the
      transaction watcher, updates queue + digest, applies any decisions Gregg
      marked in the queue file, commits and pushes, then sends a push summary.
      If a connector is unreachable in the scheduled resume it says so in the
      digest — never fakes.
  digest_ready_notification:
    trigger_id: trig_01FkhSNZxH84YmQznyAkEdwQ
    status: active (created 2026-07-09)
    cadence: "26 6 * * *"      # 06:26 UTC = 7:26am UK summer — 30 min after the scan
    does: >
      Throwaway session that emits one push/email line telling Gregg the
      digest is ready, with the fallback instruction if it isn't.
    notifications: [push, email]
  history:
    - trigger_id: trig_01PmYT8Ki3DzC7HqJMen6orA
      lifespan: created 2026-07-07, failed first firing 2026-07-08, deleted
      why_failed: >
        Fired a FRESH session; MCP-created triggers cannot attach a repo
        source or connectors to a fresh session, so it woke up empty.
        The 2026-07-09 rewiring avoids this entirely by resuming Morgan's
        existing session instead of spawning a new one.
    - trigger_id: trig_011XmByYbSWCJwYEthUNohNB
      lifespan: created 2026-07-08 (reminder-only), replaced 2026-07-09
      why_replaced: >
        It nudged Gregg but carried no digest — "the update wasn't ideal,
        I don't even know where it is." Replaced by daily_scan +
        digest_ready_notification above.
  friday_bank_recon_prompt:
    trigger_id: trig_017WZTyZHaiqqtyB86i8jt9o
    status: active (created 2026-07-09)
    cadence: "33 14 * * 5"     # Friday 14:33 UTC = 3:33pm UK summer / 2:33pm winter
    does: >
      Push/email prompting Gregg to attach the week's Tide statement (CSV) in
      his Morgan session and say "recon the bank statement". Morgan then runs
      agents/bank-reconciler.md — matching, pinning awaiting-amount items, and
      queueing anything the bank saw that Stripe/Gmail didn't. No Tide API
      exists (registry checked 2026-07-09); statements come only from Gregg.
  weekly_summary_run: not yet scheduled (roadmap phase 4 remainder)

daily_digest:
  what: >
    All transactions currently pending review, each with its proposed category
    and one-sentence reasoning, plus anything flagged by always_queue rules.
  written_to: briefings/daily/YYYY-MM-DD.md
  tone: plain English — explicit amounts, dates, merchant names; numbered so
    Gregg can reply "approve 1, 3; decline 2" in chat

weekly_summary:
  what: >
    Totals by category (booked and pending), approved vs declined counts,
    anomalies (duplicates, unusual amounts, unmatched Stripe payouts), and
    anything ageing in the pending queue.
  written_to: briefings/weekly/YYYY-Www.md

approval_flow:
  # The only path into the books. Nothing skips pending.
  states:
    pending:   proposed by an agent, waiting for Gregg
    approved:  Gregg approved in chat — ready to book
    declined:  Gregg declined in chat — kept in queue history, never deleted
    booked:    approved entry written to books/<tax-year>/<YYYY-MM>.yaml
  mechanism: chat
  example: 'approve 1 and 3, decline 2 — that one is personal'
  rules:
    - nothing is booked as business without an explicit approval from Gregg
    - declined entries are retained with status declined (audit trail)
    - non-GBP entries stay pending until Gregg says how to record them
