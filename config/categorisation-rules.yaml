# These ALWAYS go to the pending queue for your decision, regardless of any
# other match:
always_queue:
  - rule: non-GBP amount
    reason: books are GBP-only; you decide how each foreign amount is handled
  - rule: amount over threshold
    threshold_gbp: 250
    reason: large items deserve a look even when the category seems obvious
  - rule: no rule matched
    reason: Morgan never guesses silently — unknowns are surfaced, not buried
