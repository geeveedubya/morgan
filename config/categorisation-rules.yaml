# Categorisation rules seed — THIS FILE IS YOURS TO EDIT, GREGG.
# Morgan reads it on every run and never rewrites it without asking.
# Add merchants, senders, and keywords as they come up; Morgan's proposals
# only get better as this file grows. (Roadmap: Morgan will suggest edits
# based on your approve/decline history — you accept or reject them.)
#
# How Morgan uses this file:
#   1. A transaction matching an income or expense category is PROPOSED as that
#      category (never booked — everything waits for your approval in chat).
#   2. A transaction matching a personal indicator is proposed as personal.
#   3. Anything matching an always_queue rule, or matching nothing at all,
#      goes to the queue as "uncategorised — needs your call".

income:
  indicators:
    - Stripe charges and payouts (the primary income record)
    - emails confirming client invoices or payments received
    - anything cross-referencing a client in the Airtable billable-hours base
    - trAIned activity — trAIned is a trading name of the same business.
      trAIned subscriber income IS income, UNLESS the subscriber's email is on
      oxfordcircus.co.za (media@/media+/gregg@/gregg+), which marks a test —
      then exclude (Gregg, 11 Jul 2026)
  categories:
    - sales            # client work invoiced and paid

# Not income, not expense — excluded from the books entirely (still queued
# so Gregg sees them, proposed as "exclude"):
exclude:
  indicators:
    - test events and test payments — any charge/subscriber on an
      oxfordcircus.co.za address (gregg@, gregg+..., media@, media+...) or
      described as testing (Gregg, 7 & 11 Jul 2026)

# HMRC allowable expense categories for a sole trader (not VAT-registered,
# so all amounts are recorded gross).
expenses:
  office_costs_and_software:
    hints: [subscription, SaaS, software, licence, hosting, domain, cloud]
    examples: [Google Workspace, GitHub, Adobe, Notion, AWS, Vercel, Lovable, Anthropic]
    note: >
      Multiple same-day receipts from Lovable or Anthropic are expected —
      separate planned subscriptions, not duplicate charges (Gregg, 7 Jul 2026).
      Don't flag them as duplicates.
  phone_and_internet:
    hints: [mobile, broadband, sim, data plan]
    examples: []
  travel:
    hints: [train, flight, hotel, mileage, taxi, parking]
    note: commuting to a regular workplace is NOT allowable; client travel is
    examples: []
  marketing_and_website:
    hints: [advertising, ads, SEO, design, print, freelance, gig]
    examples: [Fiverr, Squarespace domains]
  professional_fees:
    hints: [accountant, legal, solicitor, insurance, professional indemnity]
    examples: []
  bank_and_payment_fees:
    hints: [Stripe fee, bank charge, transaction fee, FX fee]
    examples: [Stripe processing fees]
  training_and_courses:
    hints: [course, training, conference, workshop, book]
    note: must maintain existing skills, not open a new trade
    examples: []
  use_of_home:
    hints: []
    note: >
      Claimed via HMRC flat rate based on hours worked from home per month —
      a month-end entry, not a per-transaction match. Handled at reconciliation.
  staff_costs:
    hints: [wages, retainer, payroll]
    note: Michelle Van Wyk is an ad-hoc employee — her compensation is allowable
      (ruled by Gregg 2026-07-10; must be real work, actually paid, market rate)
    examples: []
  equipment:
    hints: [laptop, monitor, keyboard, desk, chair, hardware]
    note: capital-ish items — flag anything over the review threshold
    examples: []

personal:
  # Merchants and patterns that are never business. Edit freely.
  indicators:
    - groceries and supermarkets
    - streaming and entertainment (Netflix, Spotify personal, gaming)
    - restaurants and takeaways (client entertainment is not allowable anyway)
    - clothing (unless protective/branded workwear)
    - personal transfers between own accounts
    - sports memberships and event fees (England Athletics, trilife — confirmed 2026-07-07)
    - gifts to family (Mindful Chef gift — confirmed 2026-07-07)
    - Josie's Winchester (confirmed 2026-07-07)

